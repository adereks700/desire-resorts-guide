name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check for broken internal links and missing assets
        run: |
          python3 <<'EOF'
          import re, os, sys

          site = "_site"
          refs = set()
          for root, dirs, files in os.walk(site):
              for f in files:
                  if f.endswith(".html"):
                      path = os.path.join(root, f)
                      text = open(path, encoding="utf-8", errors="replace").read()
                      for m in re.findall(r'(?:src|href|srcset)=["\']([^"\']+)["\']', text):
                          if m.startswith("http") or m.startswith("//") or m.startswith("mailto:") or m.startswith("tel:"):
                              continue
                          for part in m.split(","):
                              url = part.strip().split(" ")[0]
                              refs.add((path, url))

          missing = []
          for path, ref in refs:
              clean = ref.split("#")[0].split("?")[0]
              if clean in ("", "/"):
                  continue
              if not clean.startswith("/"):
                  continue
              fp = os.path.join(site, clean.lstrip("/"))
              if not os.path.exists(fp):
                  missing.append((path.replace(site + "/", ""), ref))

          if missing:
              print(f"::error::Found {len(set(missing))} broken reference(s):")
              for page, ref in sorted(set(missing)):
                  print(f"  {page} -> {ref}")
              sys.exit(1)

          print(f"OK: checked {len(refs)} references, 0 broken.")
          EOF

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: _site/
          retention-days: 7
